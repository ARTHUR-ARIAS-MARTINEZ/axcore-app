<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor Móvil — AXCore (Live)</title>
<style>
    :root {
        --bg: #06090f;
        --panel: #0e1420;
        --accent: #00e5ff;
        --text: #c8d0e0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Header */
    header {
        height: 50px;
        background: var(--panel);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
    }
    .logo {
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        color: #000;
        font-weight: 800;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        letter-spacing: 1px;
    }
    h1 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #fff;
        margin-right: auto;
    }
    .badge-live {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(34,197,94,0.1);
        border: 1px solid rgba(34,197,94,0.3);
        color: #22c55e;
        font-size: 10px;
        padding: 4px 10px;
        border-radius: 20px;
        letter-spacing: 1px;
    }
    .dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: #fff;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all .2s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
    .btn.primary {
        background: var(--accent);
        color: #000;
        font-weight: 700;
    }

    /* Body */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 30% 30%, rgba(0,229,255,.04) 0%, transparent 50%),
            radial-gradient(circle at 70% 70%, rgba(124,58,237,.04) 0%, transparent 50%);
    }

    /* Stage que ocupa todo el main y centra el teléfono */
    .phone-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .phone-wrap {
        transform-origin: center center;
        transition: transform .3s;
        flex-shrink: 0;
    }

    .phone {
        width: 393px;
        height: 852px;
        background: #1a1a1f;
        border-radius: 46px;
        padding: 11px;
        box-shadow:
            0 0 0 2px #2a2a35,
            0 0 0 4px #111118,
            0 30px 80px rgba(0,0,0,.85);
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .phone::before {
        content:''; position:absolute; left:-4px; top:100px;
        width:4px; height:32px; background:#2a2a35; border-radius:3px 0 0 3px;
        box-shadow: 0 42px 0 #2a2a35, 0 80px 0 #2a2a35;
    }
    .phone::after {
        content:''; position:absolute; right:-4px; top:130px;
        width:4px; height:50px; background:#2a2a35; border-radius:0 3px 3px 0;
    }

    .phone-top {
        background: #050505;
        border-radius: 35px 35px 0 0;
        padding: 10px 0 7px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
    }
    .di {
        width: 118px; height: 32px;
        background: #000;
        border-radius: 20px;
    }
    .status-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 18px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
    }

    .screen {
        flex: 1;
        border-radius: 0 0 34px 34px;
        overflow: hidden;
        background: #000;
        position: relative;
    }
    .screen iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: #0a0e16;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 2px;
        z-index: 10;
        transition: opacity .3s;
    }
    .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .help-msg {
        /* Mover al header para no tapar el contenido del teléfono */
        display: none;
    }
    .help-msg b { color: var(--accent); }
</style>
</head>
<body>

<header>
    <div class="logo">AX</div>
    <h1>VISOR MÓVIL — VISTA LOCAL</h1>
    <div class="badge-live" style="background:rgba(0,229,255,0.1); border-color:rgba(0,229,255,0.3); color:var(--accent);"><span class="dot" style="background:var(--accent); animation:none;"></span> VISTA LOCAL</div>
    <button class="btn primary" onclick="forceReload()">↺ Recargar app</button>
    <button class="btn" onclick="openInBrowser()">🌐 Abrir en pestaña</button>
</header>

<main>
    <div class="phone-stage">
    <div class="phone-wrap" id="phoneWrap">
        <div class="phone">
            <div class="phone-top">
                <div class="di"></div>
                <div class="status-bar">
                    <span id="clock">9:41</span>
                    <span>📶 🔋</span>
                </div>
            </div>
            <div class="screen">
                <div class="loading-overlay" id="loading">CARGANDO APP...</div>
                <iframe id="frame" src="" allow="fullscreen; camera; clipboard-write"></iframe>
            </div>
        </div>
    </div>
    </div><!-- /.phone-stage -->
</main>

<div class="help-msg">
    Esta vista carga <b>tu código local</b> de desarrollo. Todos los cambios aplicados en tus archivos locales se visualizarán aquí inmediatamente.
</div>

<script>
    const LOCAL_URL = './index.html';
    const frame = document.getElementById('frame');
    const loading = document.getElementById('loading');

    // Cargar la app con cache-busting para evitar almacenar en cache local
    function loadApp() {
        const url = LOCAL_URL + '?t=' + Date.now();
        loading.classList.remove('hidden');
        frame.src = url;
    }

    frame.addEventListener('load', () => {
        setTimeout(() => loading.classList.add('hidden'), 300);
    });

    function forceReload() {
        loadApp();
    }

    function openInBrowser() {
        window.open(LOCAL_URL, '_blank');
    }

    // Reloj en tiempo real
    function updateClock() {
        const n = new Date();
        document.getElementById('clock').textContent =
            String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 30000);

    // Auto-ajuste de escala para que el teléfono quepa completamente visible
    function autoFit() {
        const PHONE_H = 852, PHONE_W = 393;
        const HEADER_H = 50;
        const PAD = 12; // padding total (6px arriba y abajo)
        const availH = window.innerHeight - HEADER_H - PAD;
        const availW = window.innerWidth - PAD;
        const scale = Math.min(availH / PHONE_H, availW / PHONE_W, 1);
        const wrap = document.getElementById('phoneWrap');
        // Aplicar escala desde el centro
        wrap.style.transform = `scale(${scale})`;
    }
    autoFit();
    window.addEventListener('resize', autoFit);

    // Iniciar
    loadApp();
</script>
</body>
</html>
