<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AX-CORE · Cómo se usa</title>
<meta name="theme-color" content="#06141b">
<link rel="icon" href="assets/icons/app-192.png" type="image/png">
<link rel="stylesheet" href="index.css?v=20260823c">
<link rel="stylesheet" href="premium.css?v=20260823c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; }

  .gx { height: 100dvh; display: flex; flex-direction: column; }

  /* ── barra de arriba ── */
  .gx-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 16px 10px; flex: none;
  }
  .gx-brand {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: .9rem; letter-spacing: 3px;
    background: linear-gradient(120deg,
        var(--accent-tri, var(--accent-main)), var(--accent-main) 52%, var(--accent-secondary));
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .gx-close {
    cursor: pointer; text-decoration: none;
    background: transparent; border: 1px solid var(--pm-border);
    color: var(--pm-dim2, #7f93a8); border-radius: 99px; padding: .4rem .9rem;
    font-family: 'Oswald', sans-serif; font-size: .6rem;
    letter-spacing: 1.5px; text-transform: uppercase;
  }

  /* ── el carrete ── */
  .gx-track {
    flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .gx-track::-webkit-scrollbar { display: none; }

  .gx-slide {
    flex: 0 0 100%; scroll-snap-align: center;
    display: flex; flex-direction: column;
    padding: 0 16px 6px; min-width: 0;
  }

  .gx-shot {
    flex: 1; min-height: 0; position: relative;
    border-radius: 24px; overflow: hidden;
    background: linear-gradient(158deg, var(--pm-s3), var(--pm-s2) 46%, var(--pm-s1));
    border: 1px solid var(--pm-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 16px 38px rgba(0,0,0,.32);
    display: flex; align-items: center; justify-content: center;
  }
  .gx-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* velo de abajo: sin esto la letra se pierde sobre la foto */
  .gx-veil {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top,
        rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 26%, rgba(0,0,0,.28) 52%, rgba(0,0,0,0) 78%);
  }
  .gx-over {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 20px 22px;
  }
  .gx-ph {
    position: absolute; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px;
    font-family: 'Oswald', sans-serif; letter-spacing: 2px;
    color: var(--pm-dim2, #7f93a8); font-size: .68rem; line-height: 1.9;
  }
  .gx-ph b {
    display: block; font-size: 2.4rem; line-height: 1; margin-bottom: 12px;
    background: linear-gradient(120deg,
        var(--accent-tri, var(--accent-main)), var(--accent-main) 52%, var(--accent-secondary));
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }

  .gx-txt { padding: 0; }
  .gx-step {
    font-family: 'Oswald', sans-serif; font-size: .58rem;
    letter-spacing: 2.6px; text-transform: uppercase;
    color: var(--accent-main); margin-bottom: 7px;
  }
  .gx-title {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 1.35rem; letter-spacing: 1.4px; line-height: 1.1;
    color: var(--pm-white, #fff); margin: 0 0 8px;
  }
  .gx-line {
    font-size: .88rem; line-height: 1.5;
    color: rgba(255,255,255,.88); margin: 0; max-width: 46ch;
    text-shadow: 0 1px 8px rgba(0,0,0,.65);
  }
  .gx-title { text-shadow: 0 2px 12px rgba(0,0,0,.6); }

  /* ── pie: puntos y botón ── */
  .gx-foot { flex: none; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .gx-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 13px; }
  .gx-dot {
    width: 7px; height: 7px; border-radius: 99px; flex: none;
    background: var(--pm-dim2, #7f93a8); opacity: .34;
    transition: all .3s cubic-bezier(.34,1.56,.64,1); cursor: pointer;
  }
  .gx-dot.on { opacity: 1; width: 22px; background: var(--accent-main); }
  .gx-next {
    width: 100%; cursor: pointer; border: none; border-radius: 99px;
    padding: .95rem; color: #0a0a0a;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: .78rem; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(122deg,
        var(--accent-tri, var(--accent-main)) 0%, var(--accent-main) 30%, var(--accent-secondary) 100%);
    box-shadow: 0 6px 22px rgba(var(--pm-green-rgb), .3), inset 0 1px 0 rgba(255,255,255,.24);
  }
  .gx-next:active { transform: scale(.98); }

  @media (min-width: 760px) {
    .gx-slide { padding: 0 22px 6px; }
    .gx-track { max-width: 520px; margin: 0 auto; width: 100%; }
    .gx-foot { max-width: 520px; margin: 0 auto; width: 100%; }
  }
</style>
</head>
<body class="premium-mode" data-theme="fusion-aurora">

<div class="gx">
  <div class="gx-top">
    <span class="gx-brand" id="gxBrand">AX-CORE</span>
    <a class="gx-close" id="gxSalir" href="index.html">Salir</a>
  </div>

  <div class="gx-track" id="gxTrack"></div>

  <div class="gx-foot">
    <div class="gx-dots" id="gxDots"></div>
    <button class="gx-next" id="gxNext">SIGUIENTE</button>
  </div>
</div>

<script>
// Cada paso: número de imagen, título y la línea que lo explica.
// La imagen vive en assets/guia/NN.png. Si todavía no está, sale el hueco
// con su número para que se sepa cuál falta.
var GUIAS = {
  atleta: {
    nombre: 'C\u00d3MO SE USA',
    salida: 'index.html',
    pasos: [
      ['Entra con tu pase', 'Tu coach te da un pase de una sola vez. Lo escribes, pones tu nombre y ya quedaste dentro. Queda amarrado a ti: no se comparte.'],
      ['Tu tablero', 'Lo primero que ves: tu peso de hoy, cu\u00e1ntas calor\u00edas llevas y tu racha. Todo de un vistazo.'],
      ['Registra tu peso', 'Te pesas, lo anotas y la app hace el resto. Es el n\u00famero que manda: de ah\u00ed sale todo lo dem\u00e1s.'],
      ['Tu plan de comidas', 'Ocho cuadros, uno por comida. El que ya tiene plan se enciende. Tocas uno y ves qu\u00e9 te toca comer.'],
      ['Registra lo que comes', 'Escribes el alimento y cu\u00e1ntos. La app le pone las calor\u00edas sola y te dice cu\u00e1nto te queda del d\u00eda.'],
      ['Tu entrenamiento', 'La rutina que te toc\u00f3, ejercicio por ejercicio. Vas marcando lo que ya hiciste.'],
      ['Mira c\u00f3mo vas', 'Tu peso y tu cintura semana con semana, en gr\u00e1fica. Aqu\u00ed se ve el avance que en el espejo tarda en notarse.'],
      ['Presume tu avance', 'El Estudio te arma una tarjeta con tus n\u00fameros para mandarla por WhatsApp. T\u00fa eliges el estilo.'],
      ['Tus insignias', 'Cada racha, cada kilo y cada cent\u00edmetro te dan una medalla. Bronce, plata, oro, platino y leyenda.'],
      ['Ponla a tu gusto', 'En Ajustes escoges el color de toda la app, y desde ah\u00ed la instalas en tu pantalla de inicio.']
    ]
  },
  coach: {
    nombre: 'GU\u00cdA DEL COACH',
    salida: 'coach.html',
    pasos: [
      ['Entra a tu terminal', 'Con el c\u00f3digo de franquicia y la contrase\u00f1a que te dio el corporativo. Inst\u00e1lala desde ah\u00ed y te queda como app aparte.'],
      ['Tu cupo de un vistazo', 'Pases usados, cupo total de tu plan y cu\u00e1ntos te quedan. La barra te dice qu\u00e9 tanto llevas.'],
      ['Da de alta un atleta', 'Toca PASE NUEVO, escribe su nombre y listo: sale un pase de un solo uso.'],
      ['P\u00e1sale su pase', 'Con COMPARTIR se lo mandas por WhatsApp junto con la liga de la app. \u00c9l entra y queda vinculado a ti.'],
      ['Cuando alguien deja de pagar', 'CORTAR le cierra la app sin borrarlo. Cuando se ponga al corriente, RESTAURAR y sigue donde iba.'],
      ['Ponla a tu gusto', 'En Estilo visual escoges el color de toda la terminal. Se guarda en tu equipo.']
    ]
  },
  admin: {
    nombre: 'CONSOLA MAESTRA',
    salida: 'admin.html',
    pasos: [
      ['Entra con tu clave', 'La clave de mando solo la tienes t\u00fa. Inst\u00e1lala en tu celular y te queda con su icono rojo, aparte de las otras dos.'],
      ['Crea un bloque', 'Un bloque es una zona: Cd. Guzm\u00e1n, Aguascalientes. Ah\u00ed dentro van los gimnasios de esa plaza.'],
      ['Da de alta un gimnasio', 'Escoges su bloque y su plan. El sistema le genera su c\u00f3digo y su contrase\u00f1a para el coach.'],
      ['Entrega el acceso', 'En C\u00f3digos copias lo que le toca al gimnasio. Con eso su coach entra a su terminal.'],
      ['Mira qui\u00e9n la usa', 'En Atletas ves cu\u00e1ntas veces abri\u00f3 la app cada quien y cu\u00e1ndo fue la \u00faltima. Ah\u00ed se nota qui\u00e9n la trabaja.'],
      ['El freno de mano', 'CORTAR le cierra la app a un atleta al instante. Y de un golpe puedes cortar un gimnasio completo.'],
      ['Tus n\u00fameros', 'Ganancias suma lo que entra al mes, la proyecci\u00f3n del a\u00f1o y el desglose por plan.']
    ]
  }
};

var _q = new URLSearchParams(location.search).get('g') || 'atleta';
var GUIA = GUIAS[_q] || GUIAS.atleta;
var PASOS = GUIA.pasos.map(function (p, i) {
  return { img: _q + '-' + ('0' + (i + 1)).slice(-2), step: 'Paso ' + (i + 1),
           title: p[0], line: p[1] };
});

document.getElementById('gxBrand').textContent = 'AX-CORE \u00b7 ' + GUIA.nombre;
document.getElementById('gxSalir').setAttribute('href', GUIA.salida);

var track = document.getElementById('gxTrack');
var dots  = document.getElementById('gxDots');
var next  = document.getElementById('gxNext');

track.innerHTML = PASOS.map(function (p, i) {
  return '<div class="gx-slide">' +
    '<div class="gx-shot">' +
      '<img data-img="' + p.img + '" alt="' + p.title + '">' +
      '<div class="gx-ph" style="display:none"><b>' + (i + 1) + '</b>Aqu&iacute; va la imagen<br>assets/guia/' + p.img + '.png</div>' +
      '<div class="gx-veil"></div>' +
      '<div class="gx-over">' +
        '<div class="gx-step">' + p.step + ' de ' + PASOS.length + '</div>' +
        '<h1 class="gx-title">' + p.title + '</h1>' +
        '<p class="gx-line">' + p.line + '</p>' +
      '</div>' +
    '</div>' +
  '</div>';
}).join('');

// Las fotos van en WebP: pesan una décima parte que el original y en el
// celular se ven igual. Si alguna no estuviera en WebP se intenta el PNG, y
// si tampoco, sale el hueco con su número. El src se pone DESPUÉS de
// enganchar el plan B, para no perder el aviso si la imagen falla rápido.
track.querySelectorAll('.gx-shot img').forEach(function (im) {
  im.addEventListener('error', function () {
    if (!this.dataset.b) {
      this.dataset.b = '1';
      this.src = 'assets/guia/' + this.dataset.img + '.png';
    } else {
      this.style.display = 'none';
      this.nextElementSibling.style.display = 'flex';
    }
  });
  im.src = 'assets/guia/' + im.dataset.img + '.webp';
});

dots.innerHTML = PASOS.map(function (p, i) {
  return '<span class="gx-dot' + (i === 0 ? ' on' : '') + '" data-i="' + i + '"></span>';
}).join('');

function actual() {
  return Math.round(track.scrollLeft / track.clientWidth);
}
function pinta() {
  var i = actual();
  dots.querySelectorAll('.gx-dot').forEach(function (d, k) {
    d.classList.toggle('on', k === i);
  });
  next.textContent = (i >= PASOS.length - 1) ? 'EMPEZAR' : 'SIGUIENTE';
}
function ir(i) {
  track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
}

track.addEventListener('scroll', function () {
  clearTimeout(track._t);
  track._t = setTimeout(pinta, 60);
});
next.addEventListener('click', function () {
  var i = actual();
  if (i >= PASOS.length - 1) { location.href = GUIA.salida; return; }
  ir(i + 1);
});
dots.addEventListener('click', function (e) {
  var d = e.target.closest('.gx-dot');
  if (d) ir(+d.dataset.i);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') ir(Math.min(actual() + 1, PASOS.length - 1));
  if (e.key === 'ArrowLeft')  ir(Math.max(actual() - 1, 0));
});

// La guía se abre con el mismo color que el atleta eligió en la app.
// La clave del usuario cambia según quién entró, así que se busca el tema
// en lo que haya guardado la app, sin depender del nombre de la clave.
(function () {
  try {
    var tema = null;
    for (var i = 0; i < localStorage.length && !tema; i++) {
      var v = localStorage.getItem(localStorage.key(i));
      if (!v || v.indexOf('"theme"') === -1) continue;
      try {
        var o = JSON.parse(v);
        if (o && typeof o.theme === 'string' && o.theme.indexOf('fusion-') === 0) tema = o.theme;
      } catch (e) {}
    }
    if (tema) document.body.setAttribute('data-theme', tema);
    var bg = (getComputedStyle(document.body).getPropertyValue('--bg-dark') || '').trim();
    var m = document.querySelector('meta[name="theme-color"]');
    if (bg && m) m.setAttribute('content', bg);
  } catch (e) {}
})();
</script>
</body>
</html>
