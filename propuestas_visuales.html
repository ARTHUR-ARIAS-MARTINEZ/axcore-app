<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuestas Visuales AX-CORE V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Oswald:wght@700&family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --accent-neon: #00ff88;
            --accent-cyan: #00e5ff;
            --tech-silver: #e2e8f0;
            --dark-panel: rgba(10, 12, 18, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--accent-neon);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 60px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 100px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            justify-items: center;
        }

        /* --- LOGO EVOLUTION --- */
        .logo-box {
            background: radial-gradient(circle at center, #1a1f2e 0%, #0a0c12 100%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 60px 40px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-box:hover {
            transform: scale(1.02);
            border-color: var(--accent-neon);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        /* Base Tech Circle */
        .tech-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Opción 1: Hyper-Tech Badge (Cercano a la imagen del usuario) */
        .circle-inner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 136, 0.2);
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(0, 255, 136, 0.1);
        }
        .hud-rings {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px dashed var(--accent-neon);
            opacity: 0.5;
            animation: spin 10s linear infinite;
        }
        .ax-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            color: #fff;
            z-index: 2;
            text-shadow: 0 0 20px var(--accent-neon), 0 0 40px var(--accent-neon);
            letter-spacing: -2px;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Typography branding */
        .branding {
            text-align: center;
        }
        .branding h2 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .branding p {
            margin: 5px 0 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #64748b;
            font-weight: 700;
        }

        /* --- HYBRID STUDIO CARD (The Optimization) --- */
        .hybrid-card {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        /* Mixed Background: Bold Header + Tech Overlay */
        .card-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
        }
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.9) 100%);
        }

        .card-header {
            position: relative;
            z-index: 10;
            padding: 40px 30px;
        }
        .card-header h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 3.5rem;
            line-height: 0.9;
            color: var(--accent-neon);
            margin: 0;
            text-transform: uppercase;
        }

        .card-body {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px;
            z-index: 10;
        }

        .hud-elements {
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            pointer-events: none;
        }
        .hud-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--accent-neon);
        }
        .top-l { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .bot-r { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        .logro-label {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 10px;
            display: block;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 4px;
            width: fit-content;
        }

        .main-stat {
            margin-top: 20px;
        }
        .stat-val {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 5rem;
            color: #fff;
            line-height: 1;
            display: block;
        }
        .stat-unit {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-neon);
            letter-spacing: 2px;
        }

        .footer-info {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .scan-line {
            font-size: 0.5rem;
            font-family: monospace;
            color: #64748b;
        }
        .brand-pill {
            background: #fff;
            color: #000;
            font-weight: 900;
            padding: 4px 12px;
            font-size: 0.7rem;
            border-radius: 2px;
            font-style: italic;
        }

    </style>
</head>
<body>

    <h1>DISEÑO OPTIMIZADO: AX-CORE</h1>
    <p class="subtitle">Sincronización de Biología y Tecnología</p>

    <section>
        <div class="grid">
            
            <!-- Propuesta Logo: Cercana a tu referencia pero pulida -->
            <div class="logo-box">
                <div class="tech-circle">
                    <div class="circle-inner"></div>
                    <div class="hud-rings"></div>
                    <div class="ax-text">AX</div>
                </div>
                <div class="branding">
                    <h2>AX-CORE</h2>
                    <p>BY ARTHUR</p>
                </div>
            </div>

            <!-- Propuesta Estudio: El Mix "Powering Your Biology" + "HUD" -->
            <div class="hybrid-card">
                <div class="card-bg"></div>
                <div class="card-overlay"></div>
                
                <div class="hud-elements">
                    <div class="hud-corner top-l"></div>
                    <div class="hud-corner bot-r"></div>
                </div>

                <div class="card-header">
                    <h3>Powering<br>Your<br>Biology</h3>
                </div>

                <div class="card-body">
                    <span class="logro-label">LOGRO DESBLOQUEADO</span>
                    <div class="main-stat">
                        <span class="stat-val">7,700</span>
                        <span class="stat-unit">KCAL ELIMINADAS</span>
                    </div>
                    
                    <div class="footer-info">
                        <div class="scan-box">
                            <div class="scan-line">SYSTEM_STATUS: OPTIMIZED</div>
                            <div class="scan-line">SCAN_ID: 2026_AX_ATHLETE</div>
                        </div>
                        <div class="brand-pill">AX-CORE</div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
