<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AX-CORE | COACH TERMINAL VIP</title>
    <!-- PWA Support -->
    <link rel="manifest" href="manifest_vip.json">
    <meta name="theme-color" content="#0a0e14">
    <link rel="icon" href="logo_coach.png" type="image/png">
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=20260616b">
    <link rel="stylesheet" href="premium.css?v=20260616b">
    <style>
        /* ============================
           COACH TERMINAL VIP
           ============================ */
        * { box-sizing: border-box; }

        html {
            overflow-y: auto !important;
            height: auto !important;
        }
        body {
            background: var(--bg-dark, #0a0e14) !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
            position: static !important;
            transition: background 0.3s ease;
        }
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(var(--pm-green-rgb, 0,255,136), 0.07), transparent),
                radial-gradient(ellipse 50% 40% at 85% 85%, rgba(var(--pm-cyan-rgb, 0,212,255), 0.05), transparent),
                radial-gradient(ellipse 40% 30% at 50% 50%, rgba(var(--pm-green-rgb, 0,255,136), 0.03), transparent);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-main, #00ff88) 0%, var(--accent-secondary, #00d4ff) 40%, var(--accent-main, #00ff88) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonShimmer 4s ease-in-out infinite;
        }
        @keyframes neonShimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        .coach-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100vh;
        }
        /* Login centrado verticalmente dentro del contenedor */
        #login-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-height: calc(100vh - 200px);
        }
        .dashboard-container {
            align-items: flex-start;
            justify-content: flex-start;
            width: 100%;
        }

        .header-brand {
            text-align: center; 
            margin-bottom: 2.5rem;
            position: relative;
        }
        .header-brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.8rem;
            letter-spacing: 4px;
            line-height: 1;
            text-shadow: 0 0 40px rgba(var(--pm-green-rgb, 0,255,136), 0.4);
        }
        .header-brand p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 6px;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .header-brand::after {
            content: '';
            display: block;
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-main, #00ff88), transparent);
            margin: 18px auto 0;
        }

        /* LOGIN */
        #login-section {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            background: rgba(12,16,24,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border, rgba(0,255,136,0.2));
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), var(--neon-glow);
            position: relative;
            overflow: hidden;
        }
        #login-section::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-main, #00ff88), var(--accent-secondary, #00d4ff), transparent);
        }
        #login-section h2 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            letter-spacing: 3px;
            color: var(--accent-main);
        }

        /* DASHBOARD */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(10,14,20,0.85);
            backdrop-filter: blur(20px);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border, rgba(0,255,136,0.15));
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
        }
        .dashboard-header::before {
            content: '';
            position: absolute; bottom: 0; left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--pm-green-rgb, 0,255,136), 0.3), transparent);
        }
        .dashboard-header h2 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .dashboard-header p {
            margin: 4px 0 0 0;
            color: rgba(var(--pm-green-rgb, 0,255,136), 0.6);
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .stats-badge {
            background: rgba(var(--pm-green-rgb, 0,255,136), 0.08);
            color: var(--accent-main, #00ff88);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(var(--pm-green-rgb, 0,255,136), 0.25);
            box-shadow: 0 0 15px rgba(var(--pm-green-rgb, 0,255,136), 0.1);
            letter-spacing: 0.5px;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }
        .stats-badge.alert {
            background: rgba(255,50,70,0.08);
            color: var(--accent-alert, #ff4757);
            border-color: rgba(255,50,70,0.3);
            box-shadow: 0 0 18px rgba(255,50,70,0.15);
            animation: alertPulse 2s ease-in-out infinite;
        }
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(255,50,70,0.15); }
            50% { box-shadow: 0 0 28px rgba(255,50,70,0.3); }
        }

        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 18px;
            padding-right: 4px;
        }

        .client-card {
            background: var(--glass, rgba(14,14,24,0.75)) !important;
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border, rgba(255,255,255,0.06)) !important;
            border-left: 4px solid var(--accent-main, #00ff88) !important;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .client-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 20px rgba(var(--pm-green-rgb, 0,255,136), 0.08);
            border-color: rgba(var(--pm-green-rgb, 0,255,136), 0.15);
        }
        .client-card.paused {
            border-left-color: var(--accent-alert, #ff4757) !important;
            opacity: 0.65;
        }
        .client-card.paused:hover {
            box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 20px rgba(var(--pm-green-rgb, 0,255,136), 0.1);
            border-color: rgba(var(--pm-green-rgb, 0,255,136), 0.15);
        }

        .client-card h3 {
            margin: 0 0 6px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #fff;
            padding-right: 24px;
            letter-spacing: 1px;
        }
        .client-card p {
            margin: 0 0 4px 0;
            color: rgba(255,255,255,0.5);
            font-size: 0.78rem;
        }

        .btn-delete-x {
            position: absolute; right: 16px; top: 16px;
            background: rgba(255,71,87,0.08);
            border: 1px solid rgba(255,71,87,0.15);
            color: rgba(255,71,87,0.5);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-delete-x:hover {
            transform: scale(1.15);
            color: var(--accent-alert, #ff4757);
            background: rgba(255,71,87,0.15);
            box-shadow: 0 0 12px rgba(255,71,87,0.3);
        }

        .code-box {
            font-family: 'Orbitron', monospace, 'Courier New';
            background: rgba(var(--pm-green-rgb, 0,255,136), 0.08);
            padding: 4px 10px;
            border-radius: 8px;
            color: var(--accent-main, #00ff88);
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid rgba(var(--pm-green-rgb, 0,255,136), 0.2);
        }

        /* TOAST */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, var(--accent-main, #00ff88), var(--accent-secondary, #00cc6a));
            color: #000; padding: 16px 32px;
            font-size: 0.95rem; font-weight: 800;
            border-radius: 14px; z-index: 2000;
            box-shadow: 0 8px 32px rgba(var(--pm-green-rgb, 0,255,136), 0.4), 0 0 60px rgba(var(--pm-green-rgb, 0,255,136), 0.2);
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* BUTTONS */
        .btn-premium {
            background: linear-gradient(135deg, var(--accent-main, #00ff88), var(--accent-secondary, #00cc6a));
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 0.9rem 1.6rem;
        }
        .btn-premium:hover {
            box-shadow: 0 6px 24px rgba(var(--pm-green-rgb, 0,255,136), 0.4);
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-premium:active { transform: scale(0.97); }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--accent-alert, #ff4757);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-alert, #ff4757);
        }
        .btn-cancel:hover {
            transform: translateY(-1px);
            background: rgba(255,71,87,0.08);
        }

        /* INPUT */
        .input-group { margin-bottom: 0; }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--accent-main, rgba(0,255,136,0.5));
            box-shadow: 0 0 16px rgba(var(--pm-green-rgb, 0,255,136), 0.15);
            outline: none;
        }

        #dashboard { display: none; margin-top: -3vh; }

        /* Swatches de Temas */
        .t-swatch {
            transition: all 0.3s;
        }
        .t-swatch:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.05) !important;
            border-color: rgba(var(--pm-green-rgb, 0,255,136), 0.2) !important;
        }
        .t-swatch.active {
            background: rgba(var(--pm-green-rgb, 0,255,136), 0.1) !important;
            border-color: var(--accent-main, #00ff88) !important;
            box-shadow: 0 0 15px rgba(var(--pm-green-rgb, 0,255,136), 0.25);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header-brand h1 { font-size: 2.2rem; }
            .dashboard-header { padding: 0.8rem; gap: 8px; }
            .dashboard-header h2 { font-size: 1rem !important; }
            .client-grid { grid-template-columns: 1fr; }
            .stats-badge { font-size: 0.6rem; padding: 0.3rem 0.6rem; }
            .client-card { padding: 0.9rem; }
            .stats-badge { font-size: 0.7rem; padding: 0.4rem 0.8rem; }
        }
    </style>
</head>
<body class="premium-mode" data-theme="cyberpunk">

<div class="coach-container pb-transition" id="main-container">
    <div class="header-brand" style="position:relative;">
        <h1 style="background: linear-gradient(135deg, var(--accent-main, #00ff88), var(--accent-secondary, #00d4ff), var(--accent-main, #00ff88)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none;"><span>AX-CORE</span></h1>
        <p style="font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color:rgba(255,255,255,0.6); letter-spacing: 4px; margin-top:5px; text-transform:uppercase;">COACH TERMINAL VIP</p>
        <a id="btn-install-coach" href="#" style="position:absolute; right:16px; top:16px; font-size:1.5rem; color:var(--accent-main, #00ff88); text-decoration:none; cursor:pointer;" title="Instalar App">⬇</a>
    </div>

    <!-- Login -->
    <div id="login-wrapper">
    <div id="login-section" class="glass-card" style="max-width: 500px; margin: 0 auto; width: 100%;">
        <h2 style="text-align: center; color: var(--accent-main); font-family: 'Orbitron', sans-serif; margin-bottom: 1.5rem; font-size:1rem; letter-spacing:3px;">ACCESO COACH</h2>
        <div class="input-group">
            <label style="color:var(--accent-main); font-size: 0.7rem; font-weight:bold; font-family:'Orbitron',sans-serif; letter-spacing:1px;">CÓDIGO DE FRANQUICIA</label>
            <input type="text" id="gym-id" autocomplete="off" placeholder="Ej. AXB-1234" style="font-size: 1rem; text-align: center; letter-spacing: 2px; text-transform: uppercase;">
            <div style="font-size:0.62rem; color:#555; margin-top:5px;">Proporcionado por AX-CORE corporativo.</div>
        </div>
        <div class="input-group" style="margin-top:1.5rem;">
            <label style="color:var(--accent-secondary); font-size: 0.7rem; font-weight:bold; font-family:'Orbitron',sans-serif; letter-spacing:1px;">CONTRASEÑA</label>
            <input type="password" id="gym-pass" autocomplete="new-password" placeholder="Contraseña asignada" style="font-size: 1rem; text-align: center; letter-spacing: 2px;">
        </div>

    </div>
    </div><!-- /login-wrapper -->

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard-container">
        
        <div class="dashboard-header" style="flex-wrap: wrap; gap:8px;">
            <div>
                <h2 style="font-family: 'Orbitron', sans-serif; color:#fff; margin:0; font-size:0.95rem; letter-spacing:2px;" id="gym-name-display">GIMNASIO...</h2>
                <p style="margin:3px 0 0 0; color:var(--accent-secondary, #00ff88); opacity:0.75; font-size:0.65rem; font-family:'Orbitron',sans-serif; letter-spacing:2px;" id="gym-code-display">ID: ---</p>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
                <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                    <div id="stats-users" class="stats-badge" style="font-size:0.7rem; padding:0.4rem 0.8rem;">CARGANDO...</div>
                    <button class="btn-premium" style="margin:0; font-size:0.7rem; padding:0.5rem 0.9rem;" id="btn-new-code">+ PASE NUEVO</button>
                </div>
                <button class="btn-cancel" style="padding:0.4rem 0.8rem; font-size:0.65rem;" onclick="logout()">CERRAR SESIÓN</button>
            </div>
        </div>

        <!-- Selector de Temas Coach -->
        <div class="glass-card" style="margin-bottom: 24px; padding: 1.2rem; width: 100%; border: 1px solid var(--glass-border); background: var(--glass); box-shadow: var(--neon-glow); border-radius: 12px; transition: all 0.3s ease;">
            <div style="font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 2px; color: var(--accent-main); margin-bottom: 12px; text-transform: uppercase; text-align: center; font-weight: bold;">
                ESTILO VISUAL DEL TERMINAL
            </div>
            <div class="theme-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                <!-- CYBERPUNK -->
                <div class="t-swatch" data-theme="cyberpunk" onclick="setCoachTheme('cyberpunk')" style="cursor: pointer; text-align: center; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s;">
                    <div style="background: linear-gradient(135deg, #00d4aa, #00ff66); border: 2px solid rgba(0,212,170,0.3); width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 6px;"></div>
                    <div style="font-size: 0.58rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #fff; font-weight: bold;">CYBERPUNK</div>
                </div>
                <!-- ULTRA DARK -->
                <div class="t-swatch" data-theme="black" onclick="setCoachTheme('black')" style="cursor: pointer; text-align: center; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s;">
                    <div style="background: linear-gradient(135deg, #ffffff, #1a1a1a); border: 2px solid rgba(255,255,255,0.2); width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 6px;"></div>
                    <div style="font-size: 0.58rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #fff; font-weight: bold;">ULTRA DARK</div>
                </div>
                <!-- FEMENINO -->
                <div class="t-swatch" data-theme="pink" onclick="setCoachTheme('pink')" style="cursor: pointer; text-align: center; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s;">
                    <div style="background: linear-gradient(135deg, #f72585, #ff9de2); border: 2px solid rgba(247,37,133,0.3); width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 6px;"></div>
                    <div style="font-size: 0.58rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #fff; font-weight: bold;">FEMENINO</div>

                <!-- LGBT -->
                <div class="t-swatch" data-theme="pastel" onclick="setCoachTheme('pastel')" style="cursor: pointer; text-align: center; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s;">
                    <div style="background: linear-gradient(135deg, #ff9ee2, #b5e2ff); border: 2px solid rgba(255,158,226,0.3); width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 6px;"></div>

        <div id="client-list" class="client-grid">
            <div class="glass-card" style="grid-column: 1/-1; text-align:center; padding: 3rem;">
                <p style="color:#aaa; font-size: 1.2rem;">Sincronizando con base de datos global de AX-CORE...</p>
            </div>
        </div>

    <div id="toast" class="toast">¡PASE GENERADO EXITOSAMENTE!</div>

<script>
    // URL DEL BACKEND (Local si estás tu computadora, Render si está hospedado)
    const API_URL = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:3000' : 'https://axcore-appax-core-backend.onrender.com';

    // Manejo de Temas del Coach
    window.setCoachTheme = function(themeName) {
        document.body.setAttribute('data-theme', themeName);
        document.querySelectorAll('.theme-grid .t-swatch').forEach(btn => {
            if (btn.dataset.theme === themeName) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        localStorage.setItem('coach_theme', themeName);
    };
    // Inicializar con el tema guardado o Cyberpunk por defecto
    setCoachTheme(localStorage.getItem('coach_theme') || 'cyberpunk');

    const loginSection = document.getElementById('login-section');
    const dashboard = document.getElementById('dashboard');
    const btnLogin = document.getElementById('btn-login');
    const clientList = document.getElementById('client-list');
    const btnNewCode = document.getElementById('btn-new-code');
    const gymContainer = document.getElementById('main-container');

    let currentGym = "";
    let gymData = {};

    btnLogin.onclick = async () => {
        const gid = document.getElementById('gym-id').value.toUpperCase().trim();
        const psw = document.getElementById('gym-pass').value.trim();

        if(!gid || !psw) return alert("Completa ambos campos obligatorios.");
        btnLogin.textContent = "VERIFICANDO...";

        try {
            const res = await fetch(`${API_URL}/api/coach/login`, {
                method: 'POST',
                headers:{ 'Content-Type': 'application/json' },
                body: JSON.stringify({ gymCode: gid, password: psw })
            });
            const data = await res.json();
            
            if(data.success) {
                currentGym = gid;
                gymData = data.gym;
                gymData.currentUsers = data.currentUsers;

                // Guardar sesión para persistencia
                localStorage.setItem('coach_vip_gym', gid);
                localStorage.setItem('coach_vip_pass', psw);

                document.getElementById('login-wrapper').style.display = 'none';
                dashboard.style.display = 'block';

                document.getElementById('gym-name-display').textContent = gymData.name.toUpperCase();
                document.getElementById('gym-code-display').textContent = `ID SUCURSAL: ${gymData.gymCode}`;
                
                loadClients();
            } else {
                alert(data.message);
            }
        } catch(e) {
            alert("Error de conexión al servidor maestro. Intente de nuevo.");
            console.error(e);
        }
        btnLogin.textContent = "INICIAR SESIÓN";
    };

    function renderClientCard(c) {
        const div = document.createElement('div');
        div.className = `client-card ${c.active ? '' : 'paused'}`;
        div.innerHTML = `
            <button class="btn-delete-x" style="width:20px; height:20px; font-size:0.65rem; top:10px; right:10px;" onclick="deleteClient('${c.code}', '${c.user}')">X</button>
            <div>
                <h3 style="font-size:1rem; margin-bottom:2px;">${c.user}</h3>
                <p style="font-size:0.65rem; margin-bottom:2px;">PASE: <span class="code-box" style="font-size:0.75rem; padding:2px 6px;">${c.code}</span></p>
                <p style="color:${c.active ? '#00ff88' : '#e8394a'}; font-weight:bold; margin-top: 5px; font-size:0.6rem;">
                    ${c.active ? '✅ ACTIVO' : '❌ ADEUDO'}
                </p>
            </div>
            <div style="margin-top: 8px; display:flex; gap:6px;">
                <button class="btn-cancel" style="flex:1; padding: 0.4rem; font-size: 0.6rem; background: ${c.active ? 'rgba(232,57,74,0.1)' : 'rgba(0,255,136,0.1)'}; border-color: ${c.active ? '#e8394a' : '#00ff88'}; color: ${c.active ? '#e8394a' : '#00ff88'};" onclick="toggleStatus('${c.code}', ${!c.active})">
                    ${c.active ? 'CORTAR' : 'RESTAURAR'}
                </button>
                <button class="btn-premium" style="flex:1; padding: 0.4rem; font-size: 0.6rem;" onclick="shareAthleteCode('${c.user}', '${c.code}')">📱 COMPARTIR</button>
            </div>
        `;
        return div;
    }

    function isGiftUser(name) {
        return typeof name === 'string' && name.indexOf('🎁') === 0;
    }

    async function loadClients() {
        try {
            const res = await fetch(`${API_URL}/api/coach/codes/${currentGym}`);
            const codes = await res.json();

            gymData.currentUsers = codes.length;
            updateStatsBadge();

            // El código de regalo se identifica por prefijo "🎁" en el campo user
            const giftCode = codes.find(c => isGiftUser(c.user)) || null;
            const regularCodes = codes.filter(c => !isGiftUser(c.user)).reverse();

            clientList.innerHTML = '';

            if(regularCodes.length === 0 && !giftCode) {
                clientList.innerHTML = `
                <div class="glass-card" style="grid-column: 1/-1; text-align:center; padding: 3rem;">
                    <p style="color:#aaa; font-size: 1.2rem;">No tienes atletas activos. Genera un pase nuevo arriba a la derecha.</p>
                </div>`;
            } else {
                regularCodes.forEach(c => clientList.appendChild(renderClientCard(c)));
            }

            // Sección regalo VIP (siempre visible al fondo)
            renderGiftSection(giftCode);

        } catch(e) {
            clientList.innerHTML = '<p style="color:red; text-align:center;">Error conectando al servidor maestro.</p>';
        }
    }

    function renderGiftSection(giftCode) {
        // Quitar sección previa si existe
        const prev = document.getElementById('gift-section');
        if (prev) prev.remove();

        const section = document.createElement('div');
        section.id = 'gift-section';
        section.style.cssText = 'grid-column: 1/-1; margin-top: 24px;';

        if (giftCode) {
            // Código ya generado — mostrar con estilo VIP
            section.innerHTML = `
                <div style="background: linear-gradient(135deg, rgba(0,255,136,0.08), rgba(0,212,255,0.06)); border: 1px solid rgba(0,255,136,0.35); border-radius: 18px; padding: 1.8rem 2rem; position: relative; overflow: hidden;">
                    <div style="position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, #00ff88, #00d4ff, transparent);"></div>
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:1rem;">
                        <span style="font-size:2rem;">🎁</span>
                        <div>
                            <div style="font-family:'Orbitron',sans-serif; font-size:0.9rem; color:#00ff88; font-weight:900; letter-spacing:2px;">CÓDIGO REGALO VIP — EXCLUSIVO PARA TI</div>
                            <div style="font-size:0.72rem; color:rgba(255,255,255,0.5); margin-top:2px;">Incluido sin costo adicional en tu membresía</div>
                        </div>
                    </div>
                    <p style="font-size:0.82rem; color:rgba(255,255,255,0.7); line-height:1.6; margin-bottom:1.2rem;">
                        Este acceso es tuyo. Úsalo para vivir la experiencia que le das a tus atletas: registra tu propio peso, calorías y progreso en la app AX-CORE. Un servicio que vale <strong style="color:#00ff88;">$X/mes</strong> — totalmente de regalo por ser parte de la red.
                    </p>
                    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                        <div>
                            <div style="font-size:0.65rem; color:rgba(0,255,136,0.6); font-family:'Orbitron',sans-serif; letter-spacing:1px; margin-bottom:4px;">TU CÓDIGO PERSONAL</div>
                            <span class="code-box" style="font-size:1.3rem; padding:8px 16px; letter-spacing:5px; box-shadow: 0 0 20px rgba(0,255,136,0.25);">${giftCode.code}</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;">
                            <button class="btn-premium" style="padding:0.6rem 1.2rem; font-size:0.65rem;" onclick="shareAthleteCode('${giftCode.user}', '${giftCode.code}')">📱 COMPARTIR</button>
                            <button class="btn-cancel" style="padding:0.6rem 1.2rem; font-size:0.65rem; color:#ff4757; border-color:rgba(255,71,87,0.3);" onclick="deleteClient('${giftCode.code}', '${giftCode.user}')">LIBERAR</button>
                        </div>
                    </div>
                </div>`;
        } else {
            // Código aún no generado — invitar a crearlo
            section.innerHTML = `
                <div style="background: rgba(0,255,136,0.04); border: 1px dashed rgba(0,255,136,0.25); border-radius: 18px; padding: 1.8rem 2rem; text-align:center;">
                    <div style="font-size:2.5rem; margin-bottom:0.8rem;">🎁</div>
                    <div style="font-family:'Orbitron',sans-serif; font-size:0.85rem; color:#00ff88; font-weight:900; letter-spacing:2px; margin-bottom:0.6rem;">CÓDIGO REGALO VIP — PENDIENTE</div>
                    <p style="font-size:0.82rem; color:rgba(255,255,255,0.55); line-height:1.6; max-width:480px; margin:0 auto 1.2rem;">
                        Tu membresía incluye <strong style="color:#00ff88;">1 acceso de regalo</strong> para que tú mismo uses la app de tus atletas. Regístrate, vive su experiencia y demuéstrales que tú también lo haces.
                    </p>
                    <button class="btn-premium" style="padding:0.8rem 2rem; font-size:0.75rem;" onclick="generateGiftCode(event)">🎁 GENERAR MI CÓDIGO DE REGALO</button>
                </div>`;
        }
        clientList.after(section);
    }

    let _giftGenerating = false;
    window.generateGiftCode = async (evt) => {
        if (_giftGenerating) return;
        // Verificar primero si ya existe (defensa extra contra dobles clicks)
        try {
            const check = await fetch(`${API_URL}/api/coach/codes/${currentGym}`);
            const existing = await check.json();
            if (existing.find(c => isGiftUser(c.user))) {
                alert('Tu código de regalo ya está generado. Lo verás en la sección VIP.');
                loadClients();
                return;
            }
        } catch(_) {}

        _giftGenerating = true;
        const btn = (evt && evt.target) || document.querySelector('#gift-section .btn-premium');
        if (btn) { btn.textContent = 'GENERANDO...'; btn.disabled = true; }
        try {
            const res = await fetch(`${API_URL}/api/coach/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gymId: currentGym, user: `🎁 Coach ${gymData.name || ''}`.trim() })
            });
            const data = await res.json();
            if (data.success) {
                loadClients();
            } else {
                alert(data.message);
                if (btn) { btn.textContent = '🎁 GENERAR MI CÓDIGO DE REGALO'; btn.disabled = false; }
            }
        } catch(e) {
            alert('Error de conexión.');
            if (btn) { btn.textContent = '🎁 GENERAR MI CÓDIGO DE REGALO'; btn.disabled = false; }
        } finally {
            _giftGenerating = false;
        }
    };

    function updateStatsBadge() {
        const badge = document.getElementById('stats-users');
        const limitStr = gymData.maxUsers === 9999 ? '∞' : gymData.maxUsers;
        const used = gymData.currentUsers;
        
        badge.innerHTML = `USADOS: ${used} / ${limitStr}`;
        
        if (gymData.maxUsers !== 9999 && used >= gymData.maxUsers) {
            badge.classList.add('alert');
            badge.innerHTML = `⚠️ LÍMITE ALCANZADO (${used}/${limitStr})`;
        } else {
            badge.classList.remove('alert');
        }
    }

    btnNewCode.onclick = async () => {
        if(gymData.maxUsers !== 9999 && gymData.currentUsers >= gymData.maxUsers) {
            return alert("⛔ HAZ ALCANZADO EL LÍMITE DE USUARIOS PERMITIDO EN ESTA SUCURSAL.\nContacta al corporativo para aumentar la capacidad.");
        }

        const userName = prompt("Nombre completo del nuevo Atleta:");
        if(!userName) return;

        btnNewCode.textContent = "CONECTANDO...";
        try {
            const res = await fetch(`${API_URL}/api/coach/generate`, {
                method: 'POST',
                headers:{ 'Content-Type': 'application/json' },
                body: JSON.stringify({ gymId: currentGym, user: userName })
            });
            const data = await res.json();
            if(data.success) {
                // Mostrar notificación Toast
                const toast = document.getElementById('toast');
                toast.textContent = `¡PASE GENERADO EXITOSAMENTE PARA ${userName.toUpperCase()}! 👉 ${data.code}`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 5000);
                
                loadClients();
            } else {
                alert(data.message);
            }
        } catch(e) {
            alert("No hay conexión con AX-CORE GLOBAL.");
        }
        btnNewCode.textContent = "+ GENERAR PASE NUEVO";
    };

    window.toggleStatus = async (code, newStatus) => {
        if(!confirm(`¿Seguro que deseas ${newStatus ? 'reestablecer' : 'cortar'} el servicio para el atleta ${code}?`)) return;

        try {
            await fetch(`${API_URL}/api/coach/toggle`, {
                method: 'POST',
                headers:{ 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, status: newStatus })
            });
            loadClients();
        } catch(e) {
            alert("Error procesando solicitud externa.");
        }
    };

    window.deleteClient = async (code, userName) => {
        if(!confirm(`⚠️ ATENCIÓN:\n¿Seguro que quieres ELIMINAR PERMANENTEMENTE a ${userName} (${code})?\nEsto no se puede deshacer y cortará su acceso de inmediato.`)) return;
        
        try {
            await fetch(`${API_URL}/api/coach/users/${code}`, {
                method: 'DELETE'
            });
            loadClients();
        } catch(e) {
            alert("Error borrando el usuario en la nube.");
        }
    };

    window.shareAthleteCode = (userName, code) => {
        const text = `¡Hola ${userName}!\nAquí tienes tu pase VIP para entrar a la App AX-CORE:\n\nPASE: ${code}\n\nIngresa desde aquí: https://arthur-arias-martinez.github.io/axcore-app/`;
        navigator.clipboard.writeText(text).then(() => {
            alert(`✅ ¡Copiado!\n\nMensaje con el pase de ${userName} copiado al portapapeles. ¡Ve y pégalo en WhatsApp!`);
        }).catch(() => {
            prompt("Copia este pase manualmente:", text);
        });
    };

    document.getElementById('gym-id').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') btnLogin.click();
    });
    document.getElementById('gym-pass').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') btnLogin.click();
    });

    // --- Cerrar sesión ---
    window.logout = () => {
        localStorage.removeItem('coach_vip_gym');
        localStorage.removeItem('coach_vip_pass');
        location.reload();
    };

    // --- Auto-login si hay sesión guardada ---
    (function autoLogin() {
        const storedGym = localStorage.getItem('coach_vip_gym');
        const storedPass = localStorage.getItem('coach_vip_pass');
        if (storedGym && storedPass) {
            document.getElementById('gym-id').value = storedGym;
            document.getElementById('gym-pass').value = storedPass;
            btnLogin.click();
        }
    })();

    // --- INSTALACI�N PWA ---
    let deferredPrompt = null;
    const btnInstallCoach = document.getElementById('btn-install-coach');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (btnInstallCoach) btnInstallCoach.style.display = 'block';
    });
    if (btnInstallCoach) {
        btnInstallCoach.addEventListener('click', (e) => {
            e.preventDefault();
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(result => {
                if (result.outcome === 'accepted') btnInstallCoach.style.display = 'none';
                deferredPrompt = null;
            });
        });
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>

</body>
</html>
